<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="meta-theme-color" content="#f8fafc" />
    <title>기록 관리</title>
    <script>
      // FOUC 방지: 페이지 로드 전에 저장된 테마를 즉시 적용
      (function() {
        var saved = localStorage.getItem('rt-theme');
        var theme = 'light';
        if (saved === 'dark' || saved === 'light') {
          theme = saved;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.getElementById('meta-theme-color');
        if (meta) {
          meta.content = theme === 'dark' ? '#0c1220' : '#f8fafc';
        }
      })();
    </script>
  </head>
  <body>
    <main class="container app-shell" id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
